<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Codex 登录态同步</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12a9 9 0 0 1-15.5 6.2L3 16"/>
          <path d="M3 12a9 9 0 0 1 15.5-6.2L21 8"/>
          <path d="M3 21v-5h5"/>
          <path d="M21 3v5h-5"/>
        </svg>
      </span>
      <div class="brand-text">
        <h1>Codex 登录态同步</h1>
        <p>ChatGPT → ~/.codex/auth.json</p>
      </div>
    </div>
    <label class="switch" title="自动检查 + 自动推送总开关">
      <input type="checkbox" id="enabled">
      <span class="track"><span class="thumb"></span></span>
    </label>
  </header>

  <main>
    <!-- 状态主卡 -->
    <section class="card hero">
      <div class="row between">
        <span class="label">登录状态</span>
        <span id="statusPill" class="pill muted">检测中…</span>
      </div>
      <div class="account-row">
        <span id="account" class="account">—</span>
        <span id="plan" class="plan hidden">—</span>
      </div>
      <div class="meter" title="Token 剩余有效期（满刻度 10 天）">
        <div id="meterFill" class="meter-fill"></div>
      </div>
      <div class="row between small">
        <span id="days" class="muted-text">Token 剩余 —</span>
        <button id="btnPing" class="pill ghost as-btn" title="测试原生助手连接">助手检测…</button>
      </div>
    </section>

    <!-- 时间线 -->
    <section class="card timeline">
      <div class="row">
        <span class="label">上次检查</span>
        <span id="lastCheck" class="value">—</span>
      </div>
      <div class="row">
        <span class="label">上次推送</span>
        <span id="lastPush" class="value">—</span>
      </div>
    </section>

    <!-- 操作 -->
    <div class="actions">
      <button id="btnCheck" class="btn ghost">立即检查</button>
      <button id="btnPush" class="btn primary">立即推送</button>
    </div>

    <!-- 设置 -->
    <details class="card settings" id="settingsBox">
      <summary>
        <span>设置</span>
        <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg>
      </summary>
      <div class="settings-body">
        <label class="field">
          <span>检查周期（分钟）</span>
          <input id="checkPeriodMin" type="number" min="1" max="720" step="1">
        </label>
        <label class="field">
          <span>推送间隔（小时）</span>
          <input id="pushIntervalHours" type="number" min="1" max="240" step="1">
        </label>
        <p class="hint">
          每次推送都是全新的 10 天有效期 Token。浏览器需保持运行，但无需打开 chatgpt.com 标签页。
        </p>
      </div>
    </details>
  </main>

  <div id="toast" class="toast"></div>
  <script src="popup.js"></script>
</body>
</html>
